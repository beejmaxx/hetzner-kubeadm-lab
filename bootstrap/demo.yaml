apiVersion: v1
kind: Namespace
metadata:
  name: network-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: network-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: network-lab
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: network-lab
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker2
  containers:
    - name: client
      image: busybox:1.37
      command: [sleep, infinity]
